<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | NETFLIX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-bg" aria-hidden="true"></div>

      <header class="login-header">
        <a href="index.html" class="login-logo" aria-label="NETFLIX 홈">NETFLIX</a>
      </header>

      <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
          <h1 id="login-title">로그인</h1>

          <form id="login-form" class="login-form" novalidate>
            <div class="form-group">
              <input
                type="email"
                id="email"
                name="email"
                placeholder=" "
                autocomplete="email"
                required
              />
              <label for="email">이메일 주소</label>
            </div>

            <div class="form-group">
              <input
                type="password"
                id="password"
                name="password"
                placeholder=" "
                autocomplete="current-password"
                required
              />
              <label for="password">비밀번호</label>
            </div>

            <p id="login-error" class="form-error" role="alert"></p>

            <button type="submit" class="btn btn-primary login-submit">로그인</button>

            <div class="login-options">
              <label>
                <input type="checkbox" name="remember" checked />
                로그인 정보 저장
              </label>
              <a href="#" class="login-help">도움이 필요하신가요?</a>
            </div>
          </form>

          <p class="login-signup">
            Netflix 회원이 아닌가요?
            <a href="#login-form">지금 가입하세요</a>
          </p>
          <p class="login-demo-hint">
            데모용: 아무 이메일/비밀번호(4자 이상)로 로그인할 수 있습니다.
          </p>
        </section>
      </main>

      <footer class="login-footer">
        <p>이 페이지는 TMDB API를 활용한 학습용 클론입니다.</p>
      </footer>
    </div>

    <script src="js/secrets.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
